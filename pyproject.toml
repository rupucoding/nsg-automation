[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsg-automation"
version = "1.0.0"
description = "Validate, plan and apply Azure Network Security Group rules safely from the command line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-network>=33.0.0",
    "azure-mgmt-resource>=24.0.0",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
nsg-tool = "nsg_automation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
